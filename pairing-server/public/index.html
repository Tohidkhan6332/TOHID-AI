<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOHID-AI • Pairing</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#111;border:1px solid #282828;border-radius:20px;padding:28px;box-shadow:0 20px 70px #000}h1{margin:0 0 8px;font-size:32px}p{color:#999}label{display:block;margin:18px 0 7px;color:#ccc}input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#080808;color:#fff;font-size:16px}.row{display:flex;gap:10px;margin-top:18px}.btn{flex:1;padding:14px;border:0;border-radius:10px;background:#e11;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#222;border:1px solid #333}.result{margin-top:22px;text-align:center;min-height:100px}.code{font-size:28px;letter-spacing:5px;font-weight:800;padding:18px;background:#080808;border-radius:12px}.qr{max-width:260px;width:100%;background:#fff;padding:10px;border-radius:12px}.status{margin-top:12px;color:#aaa}</style></head><body><div class="card"><h1>TOHID-AI Pairing</h1><p>Generate a WhatsApp pairing code or QR code for your session.</p><label>Session ID</label><input id="sid" placeholder="my-session" value="tohid-ai"><label>WhatsApp number</label><input id="phone" inputmode="numeric" placeholder="919876543210"><div class="row"><button class="btn" onclick="pair()">Pairing Code</button><button class="btn alt" onclick="start()">Start QR</button></div><div id="result" class="result"></div></div><script>const $=id=>document.getElementById(id);async function start(){const sessionId=$('sid').value;await fetch('/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId})});poll(sessionId)}async function pair(){const sessionId=$('sid').value,phone=$('phone').value;const r=await fetch('/api/pairing',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId,phone})});const d=await r.json();if(d.error)return $('result').innerHTML='<p>'+d.error+'</p>';render(d);poll(sessionId)}async function poll(id){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,1500));const r=await fetch('/api/session/'+encodeURIComponent(id));const d=await r.json();render(d);if(d.status==='connected')break}}function render(d){let x='<div class="status">Status: '+(d.status||'unknown')+'</div>';if(d.pairingCode)x='<div class="code">'+d.pairingCode+'</div>'+x;if(d.qr)x='<img class="qr" src="'+d.qr+'">'+x;$('result').innerHTML=x}</script></body></html>
